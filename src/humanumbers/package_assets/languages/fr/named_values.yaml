# Publication note: YAML asset pack for humanumbers.
# Runtime/reference usage is documented in docs/yaml-asset-inventory.md.
version: 2
language:
  code: fr
  name: French
  native_name: Français
  scripts: [Latn]
model: split_core_language
basic_aliases:
  exact.pair: [paire, une paire]
  fraction.tenth: [dixième, un dixième]
  fraction.quarter: [quart, un quart]
  fraction.third: [tiers, un tiers]
  fraction.half: [moitié, demi]
  fraction.three_quarters: [trois quarts]
  exact_group.dozen: [douzaine, une douzaine]
  scale_bucket.tens: [dizaines]
  scale_bucket.hundreds: [centaines]
  scale_bucket.thousands: [milliers]
  scale_base.thousand: [mille]
  scale_base.ten_thousand: [dix mille]
  scale_base.million: [million, millions]
composition:
  order: [left, right]
  joiners:
    multiplier_on_scale_base: [de]
    bucket_on_scale_base: [de]
    multiplier_on_unit: [de]
    bucket_on_unit: [de]
  starter_examples:
    - surface: centaines de milliers
      rule: bucket_on_scale_base
      left_id: scale_bucket.hundreds
      right_key: scale_base.thousand