# Publication note: YAML asset pack for humanumbers.
# Runtime/reference usage is documented in docs/yaml-asset-inventory.md.
version: 1
language:
  code: ru
  name: Russian
  native_name: Русский
  scripts: [Cyrl]
pack_kind: unit_surface_lexicon
notes:
  - Compact parser-facing surface forms for Russian unit input.
  - This is not a full morphology table; it only carries the forms needed by the current API prototype.

