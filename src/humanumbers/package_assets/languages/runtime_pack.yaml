# Runtime phrase packs used by humanize/benchmark sentence templates.
#
# Schema:
# - default_language: fallback language code
# - packs.<language_code>: mapping with phrase templates and descriptor bands
# - band_descriptors: ordered from tiny to huge magnitude
version: 1
default_language: en
packs:
  ru:
    code: ru
    word_separator: ' '
    about_fallback: около
    nearly_template: почти {unit}
    less_than_template: меньше {unit}
    range_template: в пределах {low}-{high} {unit}
    level_match_template: примерно на уровне {reference}
    almost_like_template: почти как {reference}
    percent_lower_template: примерно на {pct}% ниже {reference}
    percent_higher_template: примерно на {pct}% выше {reference}
    ratio_more_template: примерно в {multiplier} раза больше, чем {reference}
    ratio_less_template: примерно в {multiplier} раз меньше, чем {reference}
    relative_more_template: заметно больше, чем {reference}
    relative_less_template: заметно меньше, чем {reference}
    absolute_higher_template: на {delta} выше
    absolute_lower_template: на {delta} ниже
    scale_lower_template: это {descriptor} на фоне {reference}
    scale_higher_template: это {descriptor} относительно {reference}
    scale_lower_alt_template: рядом с {reference} это {descriptor}
    scale_higher_alt_template: рядом с {reference} это уже {descriptor}
    band_descriptors:
    - пыль
    - след
    - крошки
    - крошечно
    - очень мало
    - немного
    - небольшое
    - заметная часть
    - не так уж далеко
    - чуть меньше
    - примерно столько же
    - чуть больше
    - немного больше
