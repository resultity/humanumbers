# Publication note: YAML asset pack for humanumbers.
# Runtime/reference usage is documented in docs/yaml-asset-inventory.md.
version: 2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  scripts: [Deva]
model: split_core_language
basic_aliases:
  exact.pair: [जोड़ी, एक जोड़ी]
  fraction.tenth: [दसवां हिस्सा, एक दसवां]
  fraction.quarter: [चौथाई, एक चौथाई]
  fraction.third: [तिहाई, एक तिहाई]
  fraction.half: [आधा]
  fraction.three_quarters: [तीन चौथाई]
  exact_group.dozen: [दर्जन, एक दर्जन]
  scale_bucket.tens: [दसों, कई दस]
  scale_bucket.hundreds: [सैकड़ों, कई सौ]
  scale_bucket.thousands: [हज़ारों, कई हज़ार]
  scale_base.thousand: [हज़ार]
  scale_base.ten_thousand: [दस हज़ार]
  scale_base.million: [मिलियन]
composition:
  order: [left, right]
  joiners:
    multiplier_on_scale_base: []
    bucket_on_scale_base: []
    multiplier_on_unit: [का, के, की]
    bucket_on_unit: [का, के, की]
  starter_examples:
    - surface: सैकड़ों हज़ार
      rule: bucket_on_scale_base
      left_id: scale_bucket.hundreds
      right_key: scale_base.thousand